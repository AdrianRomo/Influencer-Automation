[project]
name = "influencer-automation"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "celery>=5.6.2",
    "celery-types==0.24.0",
    "elevenlabs>=2.30.0",
    "fastapi>=0.128.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "mutagen>=1.47.0",
    "openai>=2.15.0",
    "bcrypt>=4.0.0",
    "psycopg2-binary>=2.9.11",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.45",
    "pybreaker>=1.2.0",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.40.0",
    "prometheus-client>=0.25.0",
    "sentry-sdk[celery,fastapi]>=2.58.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]
