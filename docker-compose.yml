services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mvp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mvp"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/mvp
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUDIO_DIR: /data/audio
      IMAGE_DIR: /data/images
      VIDEO_DIR: /data/video
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./:/app
      - audio-data:/data/audio
      - image-data:/data/images
      - video-data:/data/video
    ports:
      - "${API_PORT:-8085}:8085"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bootstrap: inspect existing schema, stamp alembic at the right revision,
    # then run any outstanding migrations before starting the API.
    command: >
      sh -c "python /app/scripts/migrate_bootstrap.py &&
             alembic upgrade head ||
             echo '[WARNING] alembic upgrade head failed — API will rely on create_all fallback';
             uvicorn app.main:app --host 0.0.0.0 --port 8085 --reload
             --proxy-headers --forwarded-allow-ips '*'"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/mvp
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUDIO_DIR: /data/audio
      IMAGE_DIR: /data/images
      VIDEO_DIR: /data/video
    volumes:
      - ./:/app
      - audio-data:/data/audio
      - image-data:/data/images
      - video-data:/data/video
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["/opt/venv/bin/celery", "-A", "app.tasks.celery_app", "worker", "-l", "INFO"]

  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/mvp
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Set ENABLE_SCHEDULED_GENERATION=true in .env to activate the daily schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    command: ["/opt/venv/bin/celery", "-A", "app.tasks.celery_app", "beat", "-l", "INFO"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8085}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - backend
    depends_on:
      - api

volumes:
  db-data:
  audio-data:
  image-data:
  video-data:

networks:
  backend:
    driver: bridge
